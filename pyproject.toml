[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amrte-research-core"
version = "0.27.0"
description = "Non-broker-connected AMRTE research architecture"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
test = [
    "httpx2",
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["Tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
